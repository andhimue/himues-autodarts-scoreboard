<!-- Frontend/templates/partials/_view_bull_off.html -->

<div id="bull-off-view-container" style="display: none;">

    <div class="game-rules-description" style="display: none;">
        <p class="game-rules-description__help-first-line">Das Ausbullen dient zur Ermittlung der Startreihenfolge für das Hauptspiel.</p>
        <ul>
            <li>Jeder Spieler wirft einen Dart auf das Bullseye.</li>
            <li>Der Spieler, dessen Dart am nächsten am Zentrum landet, beginnt das Spiel.</li>
            <li>Bei einem Unentschieden wird das Ausbullen wiederholt.</li>
        </ul>
    </div>

    <table class="game-table" id="bull-off-table">
        <thead>
            <tr>
                <th>Spieler</th>
                <th>Abstand</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<template id="bull-off-row-template">
    <tr>
        <td class="game-table__cell game-table__cell--player-name"></td>
        <td class="game-table__cell game-table__cell--score"></td>
    </tr>
</template>
